schema = 1
id = "io.github.licyk.portable-downloader"
name = { en = "Portable package downloader", zh = "整合包下载器" }
version = "0.2.0"
publisher = "licyk"
license = "GPL-3.0-only"
description = { en = "Lists the sd-webui-all-in-one portable packages for this platform, downloads and extracts the one you choose, and registers it as an instance.", zh = "列出适用于当前平台的 sd-webui-all-in-one 整合包，下载并解压所选整合包，然后将其注册为实例。" }

[engines]
# 0.3.32: the frame UI kit and the frame's `locale()`, and `[update]`.
hanafubuki = ">=0.3.32, <0.4"
api = 1

# Each release publishes `latest.json` beside its package (scripts/package.py).
[update]
url = "https://github.com/licyk/hanafubuki-ext-portable-downloader/releases/latest/download/latest.json"

[backend]
python = "backend/main.py"
requirements = "requirements.txt"
# Downloads and extraction use sd_webui_all_in_one's downloader and archive
# manager, which is why the application versions are pinned above.
sdWebuiAllInOne = true

[permissions]
instances = "read"          # instances.get: the names of the instances a package became
registerInstances = true    # instances.scan: attach the extracted package

[contributes]
settings = "schemas/settings.json"
locales = "locales/{locale}.json"
ui = [
  { slot = "pages", kind = "frame", entry = "ui/index.html", id = "downloader", title = { en = "Portable packages", zh = "整合包下载" } },
]
